name: PR checks

# Enforces the naming conventions the release automation depends on. A PR that
# fails any job cannot be merged (wire these in as required status checks:
# Settings -> Branches -> main -> Require status checks to pass).
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  # The PR title becomes the commit subject on a squash-merge, and that subject
  # is what drives the version bump. So the title itself must be conventional.
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            style
            docs
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" must start lower-case (not a capital letter).

  # Branches must read as `type/short-description`, e.g. feat/dev-mode.
  branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        run: |
          branch="${{ github.head_ref }}"
          echo "Branch: $branch"
          pattern='^(feat|fix|perf|refactor|style|docs|test|build|ci|chore|revert)/[a-z0-9._-]+$|^cursor/[a-z0-9._-]+$'
          if ! echo "$branch" | grep -Eq "$pattern"; then
            echo "::error::Branch '$branch' does not match $pattern"
            echo "Rename it, e.g.  git branch -m feat/short-description"
            exit 1
          fi

  # Every individual commit must be conventional too, so a merge-commit (not
  # just a squash) still yields a clean, parseable history on main.
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint PR commits
        run: npx commitlint --from "origin/${{ github.base_ref }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

  # The same gates the pre-commit hook runs, so a commit made with
  # --no-verify, or from a machine without the hooks, cannot slip through.
  # Windows, because that is what ships and what the taskbar readout and the
  # tray compile for.
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  # The GPUI app, compiled for the browser and packed for the host page.
  # Zed's web backend is single-threaded here, so this stays on stable Rust.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: swatinem/rust-cache@v2
      - name: Build the wasm app
        run: cargo build -p fastdash-app --target wasm32-unknown-unknown --locked
      - name: Pack the host-page assets
        run: |
          version="$(cargo metadata --format-version 1 --filter-platform wasm32-unknown-unknown --locked \
            | python3 -c 'import json,sys; packages=json.load(sys.stdin)["packages"]; print(next(p["version"] for p in packages if p["name"]=="wasm-bindgen"))')"
          cargo install wasm-bindgen-cli --version "$version" --locked
          wasm-bindgen --target web --out-dir "$RUNNER_TEMP/fastdash-web" \
            target/wasm32-unknown-unknown/debug/fastdash.wasm
          test -s "$RUNNER_TEMP/fastdash-web/fastdash.js"
          test -s "$RUNNER_TEMP/fastdash-web/fastdash_bg.wasm"
