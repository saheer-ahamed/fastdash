name: Release

# Fully automatic releases on merge to main:
#   1. Analyze the Conventional Commits since the last v* tag and compute the
#      next version (no releasable commit -> no release).
#   2. Bump every manifest via scripts/bump-version.sh (the single source of
#      truth for a bump).
#   3. Make the `chore(release): vX.Y.Z` bump commit locally and push ONLY the
#      tag - never a commit to main. main's ruleset forbids direct pushes to the
#      branch, but tag refs are unrestricted, and the tag carries the bumped
#      manifests so each release is internally consistent.
#   4. Build the app, its signed NSIS installer and the portable zip, and
#      publish the GitHub release (not a draft, so it is immediately "latest").
#   5. Upload latest.json so installed apps self-update via the in-app updater.
#
# Never tag or bump by hand - let the merge do it. workflow_dispatch is the only
# manual escape hatch: it forces a chosen bump even with no releasable commits.
#
# Because nothing is pushed to main, the manifests on the branch are NOT bumped
# between releases - that drift is cosmetic. The version is always computed from
# the tags (highest v* tag), not from the committed manifests, so it stays
# correct regardless. The tag push does not retrigger this workflow (it triggers
# on branch pushes only).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Force a release with this bump level"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

# One release at a time. The next version is read from the highest v* tag, so
# two runs that overlap both read the same tag and both compute the same version
# - whichever pushes second dies on "tag already exists", and the commits it was
# releasing stay unreleased with nothing but a red run to say so. Two PRs merged
# a few seconds apart is all it takes, and that is exactly how v0.10.0 shipped
# without the commit that the second run was building.
#
# Queued rather than cancelled: a superseded run here is a release that never
# happened, and `cancel-in-progress` would throw away the very run that carries
# the newest commits. Waiting instead lets the second run recompute against the
# tag the first one just pushed, which is the version it should have had.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      # Full history + tags so version computation can see the last release, and
      # RELEASE_TOKEN so the release commit can be pushed back to protected main.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      # Decide the next version from Conventional Commits since the last tag.
      # Sets outputs: release (true/false), version (X.Y.Z), tag (vX.Y.Z).
      - name: Compute next version
        id: version
        shell: bash
        env:
          FORCE_BUMP: ${{ github.event.inputs.bump }}
        run: |
          set -euo pipefail

          # Highest v* tag by version, NOT `git describe`: release tags point at
          # off-main bump commits, so they are not reachable from HEAD and
          # describe would miss them. `${last_tag}..HEAD` still yields exactly the
          # main commits added since that release (the tag's parent is on main).
          last_tag="$(git tag -l 'v*' --sort=-v:refname | head -n 1)"
          if [ -z "$last_tag" ]; then
            range=""
            base="0.0.0"
            echo "no previous v* tag; scanning full history"
          else
            range="${last_tag}..HEAD"
            base="${last_tag#v}"
            echo "scanning ${range}"
          fi

          if [ -n "${FORCE_BUMP:-}" ]; then
            # Manual dispatch overrides commit analysis.
            bump="$FORCE_BUMP"
          else
            has_break=0; has_feat=0; has_fix=0
            # Type detection from subjects (feat / fix / perf and the `!` marker).
            while IFS= read -r s; do
              [ -z "$s" ] && continue
              [[ "$s" =~ ^[a-z]+(\([^\)]*\))?!: ]] && has_break=1
              [[ "$s" =~ ^feat(\([^\)]*\))?: ]] && has_feat=1
              [[ "$s" =~ ^(fix|perf)(\([^\)]*\))?: ]] && has_fix=1
            done < <(git log ${range:+$range} --format='%s')
            # A BREAKING CHANGE footer anywhere in a body also forces major.
            if git log ${range:+$range} --format='%b' | grep -q 'BREAKING CHANGE'; then
              has_break=1
            fi

            if [ "$has_break" = 1 ]; then bump="major"
            elif [ "$has_feat" = 1 ]; then bump="minor"
            elif [ "$has_fix" = 1 ]; then bump="patch"
            else bump="none"
            fi
          fi

          if [ "$bump" = "none" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "No releasable commits since ${last_tag:-<start>} - skipping release."
            exit 0
          fi

          IFS=. read -r MA MI PA <<< "$base"
          case "$bump" in
            major) MA=$((MA + 1)); MI=0; PA=0 ;;
            minor) MI=$((MI + 1)); PA=0 ;;
            patch) PA=$((PA + 1)) ;;
          esac
          next="${MA}.${MI}.${PA}"

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=${next}" >> "$GITHUB_OUTPUT"
          echo "tag=v${next}" >> "$GITHUB_OUTPUT"
          echo "Next version: v${next} (${bump} bump from ${base})"

      # Only for `npm version` in the bump script; nothing else here needs npm.
      - uses: actions/setup-node@v5
        if: steps.version.outputs.release == 'true'
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        if: steps.version.outputs.release == 'true'

      # Rust release builds are the slow part; cache them between runs.
      - uses: swatinem/rust-cache@v2
        if: steps.version.outputs.release == 'true'
        with:
          workspaces: . -> target

      # Bump every manifest, commit locally, and push ONLY the tag. Done before
      # the build so the artifacts carry the new version. The bump commit is not
      # pushed to main (the ruleset forbids it) - it exists solely as the tag's
      # target, which keeps the tagged tree consistent with the built artifacts.
      - name: Bump and tag
        if: steps.version.outputs.release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/bump-version.sh "${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): ${{ steps.version.outputs.tag }}"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Build the app
        if: steps.version.outputs.release == 'true'
        shell: bash
        env:
          # Baked into the binary by crates/fastdash-core/build.rs. Public
          # identifier, not a secret - it is a repo VARIABLE, not a repo secret.
          # If unset the app still builds and reports GitHub login as "not
          # configured".
          FASTDASH_GITHUB_CLIENT_ID: ${{ vars.FASTDASH_GITHUB_CLIENT_ID }}
          # Turns on the in-app update check. Only these builds carry a real
          # version; any other build would offer to "update" itself.
          FASTDASH_RELEASE: "1"
        run: cargo build --release --locked -p fastdash-app

      # The signed installer: what new users download and what installed apps
      # update through, the Tauri-built ones included.
      - name: Build the installer
        if: steps.version.outputs.release == 'true'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            choco install nsis -y --no-progress
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $exe = (Resolve-Path "target/release/fastdash.exe").Path
          $out = Join-Path (Resolve-Path dist).Path "fastdash_${version}_x64-setup.exe"
          & $makensis /V2 "/DVERSION=$version" "/DSOURCE=$exe" "/DOUTFILE=$out" installer/fastdash.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }
          "INSTALLER=$out" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Signed with the key every installed copy already trusts, then listed in
      # latest.json, which the in-app updater (and the Tauri updater of older
      # installs) reads from /releases/latest/download/.
      - name: Sign the installer and write the update manifest
        if: steps.version.outputs.release == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cargo run --release --locked -p xtask -- sign "$INSTALLER"
          cargo run --release --locked -p xtask -- manifest "${{ steps.version.outputs.version }}" "$INSTALLER"

      # The portable zip is what install.ps1 and Scoop consume. It avoids the
      # installer entirely: no UAC, no elevation, no SmartScreen.
      - name: Build portable zip
        if: steps.version.outputs.release == 'true'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $staging = "portable/fastdash"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item "target/release/fastdash.exe" $staging
          Copy-Item "LICENSE","README.md" $staging
          $zip = "dist/fastdash_${version}_x64_portable.zip"
          Compress-Archive -Path "$staging/*" -DestinationPath $zip -Force

      # SHA256 for every download, so install.ps1 and the Scoop manifest can
      # verify what they fetched instead of trusting the transport alone.
      - name: Generate checksums
        if: steps.version.outputs.release == 'true'
        shell: pwsh
        run: |
          $lines = foreach ($f in Get-ChildItem dist -File -Include *.exe,*.zip -Recurse) {
            $h = (Get-FileHash -Algorithm SHA256 -Path $f.FullName).Hash.ToLower()
            "$h  $($f.Name)"
          }
          $lines | Out-File -FilePath "dist/SHA256SUMS.txt" -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      # Published immediately (not a draft) so it is marked "latest" and its
      # latest.json is reachable at the URL installed apps poll.
      - name: Publish the release
        if: steps.version.outputs.release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          gh release create "$tag" dist/* --title "fastdash $tag" --notes "" --latest
