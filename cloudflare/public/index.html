<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1" />
    <title>fastdash</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0a0b0c; color: #c8ccd1; }
      #boot { margin: 12vh auto; max-width: 38rem; padding: 0 1.25rem; font: 15px/1.5 ui-sans-serif, system-ui, sans-serif; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
    </style>
  </head>
  <body>
    <p id="boot">Loading fastdash…</p>
    <script type="module">
      const boot = document.getElementById("boot");
      try {
        const module = await import("./fastdash.js");
        await module.default();
        boot.remove();
      } catch (error) {
        boot.textContent = "fastdash did not start. " + (error && error.message ? error.message : error);
      }
    </script>
  </body>
</html>
