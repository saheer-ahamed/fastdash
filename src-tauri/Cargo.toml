[package]
name = "fastdash"
version = "0.9.3"
description = "A super-fast Claude usage + connectors dashboard"
edition = "2021"
rust-version = "1.77"

# The Tauri app is split into a lib (the actual app) and a thin main binary
# so the same code can target desktop and (later) mobile.
[lib]
name = "fastdash_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# In-app auto-update: the updater plugin checks the signed GitHub release and
# downloads the new installer; the process plugin restarts into it.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"

# --- Shared connector deps, pre-declared so per-connector worktrees never
# --- collide on Cargo.toml. Each connector uses the subset it needs.
reqwest = { version = "0.12", features = ["json"] }
notify = "6"
toml = "0.8"
directories = "5"
futures = "0.3"
open = "5"

# `keyring` needs a per-platform backend feature, so it is declared per target
# rather than in `[dependencies]`: Credential Manager on Windows, Keychain
# Services on macOS. Enabling the wrong one compiles to a no-op store that
# silently loses secrets, hence the split.
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

# Single-instance guard. Launching fastdash again (Start menu, shortcut, the
# installer's "run now") must focus the window that is already open rather than
# start a second copy - two copies would fight over the same config file and
# keychain entries. Desktop-only: mobile has no second-launch notion.
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

# Smaller, faster release binaries.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
