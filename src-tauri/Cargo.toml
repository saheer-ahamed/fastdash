[package]
name = "fastdash"
version.workspace = true
description = "A super-fast Claude usage + connectors dashboard"
edition.workspace = true
license.workspace = true
rust-version = "1.77"

# The Tauri app is split into a lib (the actual app) and a thin main binary
# so the same code can target desktop and (later) mobile.
[lib]
name = "fastdash_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Everything that is not the Tauri shell: engine, connectors, taskbar readout.
fastdash-core = { path = "../crates/fastdash-core" }
tauri = { version = "2", features = ["tray-icon"] }
# In-app auto-update: the updater plugin checks the signed GitHub release and
# downloads the new installer; the process plugin restarts into it.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"

# Single-instance guard. Launching fastdash again (Start menu, shortcut, the
# installer's "run now") must focus the window that is already open rather than
# start a second copy - two copies would fight over the same config file and
# keychain entries. Desktop-only: mobile has no second-launch notion.
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
